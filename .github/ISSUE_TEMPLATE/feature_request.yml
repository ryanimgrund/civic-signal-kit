name: Feature request
description: Suggest an improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: need
    attributes:
      label: Public-interest need
      description: Who does this help and how?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions and risks
      description: What could be misunderstood?
