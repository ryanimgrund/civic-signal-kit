[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-signal-kit"
version = "0.2.0"
description = "Transparent trend summaries for public-interest time-series data."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Ryan Imgrund" }
]
keywords = ["civic-tech", "public-interest", "data", "time-series", "risk-communication"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ryanimgrund/civic-signal-kit"
Documentation = "https://github.com/ryanimgrund/civic-signal-kit#readme"
Changelog = "https://github.com/ryanimgrund/civic-signal-kit/blob/main/CHANGELOG.md"
Issues = "https://github.com/ryanimgrund/civic-signal-kit/issues"

[project.scripts]
civic-signal = "civic_signal_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
